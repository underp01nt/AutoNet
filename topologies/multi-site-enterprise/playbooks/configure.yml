---
- name: Configure node interfaces
  hosts: machines
  gather_facts: no

  tasks:
    - name: Interface assignment/Default gateway setup (host)/OSPF areas
      ansible.builtin.shell: >
        {% if interfaces %}
          docker exec clab-enterprise-{{ device }} sh -ec "
            {% for name, config in interfaces.items() %}
              ip link set {{ name }} up 
              ip addr replace {{ config.ip_address }} dev {{ name }}
            {% endfor %}

            {% if 'router' in node_roles %}
              vtysh <<EOF
                configure terminal
                router ospf
                exit
                
                {% for name, config in interfaces.items() %}
                  {% if config.ospf_area is defined %}
                    interface {{ name }}
                    ip ospf area {{ config.ospf_area }}
                    
                    {% if config.ospf_passive %}
                      ip ospf passive
                    {% endif %}

                    exit
                  {% endif %}
                {% endfor %}

                end
              EOF

            {% else %}  
              ip route replace default via {{ item.value.default_gateway }}
            {% endif %}
          "

        {% endif %}

      loop: "{{ devices | dict2items }}"
      vars:
        device: "{{ item.key }}"
        interfaces: "{{ item.value.interfaces | default({}) }}"
        node_roles: "{{ item.value.roles }}"