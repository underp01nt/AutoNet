name: ospf-lab
topology:
  nodes:
    pc1:
      kind: linux
      image: alpine:latest
    pc2:
      kind: linux
      image: alpine:latest
    r1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r1/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
    r2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r2/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
    r3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r3/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
    r4:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/r4/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
  links:
    - endpoints: [pc1:eth1, r1:eth1]
    - endpoints: [r1:eth2, r2:eth1]
    - endpoints: [r1:eth3, r3:eth1]
    - endpoints: [r2:eth2, r3:eth2]
    - endpoints: [r2:eth3, r4:eth1]
    - endpoints: [r3:eth3, r4:eth2]
    - endpoints: [r4:eth3, pc2:eth1]
